name: Validate AgroShift
on:
  push:
    branches: [main, 'experiment/constraint-negotiator']
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine syntax
        run: node --check engine.mjs
      - name: Decision engine regression tests
        run: node --test engine.test.mjs negotiator.test.mjs
      - name: Install React and build dependencies
        run: npm install --no-audit --no-fund
      - name: Build React app and static NASA pages
        run: npm run build
      - name: Check public entry pages
        run: |
          test -s dist/index.html
          test -s dist/demo.html
          test -s dist/review.html
          grep -q 'assets/' dist/index.html
