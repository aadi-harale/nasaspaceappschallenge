name: Validate AgroShift
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: node --check engine.mjs
      - name: Unit tests
        run: node --test engine.test.mjs
      - name: HTML smoke validation
        run: test -s index.html && grep -q 'engine.mjs' index.html
