name: Verify NASA POWER provenance
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_nasa.py'
      - '.github/workflows/nasa-provenance.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve real NASA observations and record source hash
        run: python scripts/verify_nasa.py
      - name: Archive NASA provenance as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasa-power-provenance
          path: evidence/nasa-power-provenance.json
